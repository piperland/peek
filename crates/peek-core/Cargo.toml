[package]
name = "peek-core"
description = "Local codebase intelligence engine for coding agents."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-language = { workspace = true }
tree-sitter-rust = { workspace = true }
ignore = { workspace = true }
notify = { workspace = true }

[dev-dependencies]
# Fixtures are parsed from inline strings; nothing else is needed yet.
#
# The gate's binding measurement re-reads the fixture's own tree, because the question
# it asks — *what binds this name here* — is syntactic and cannot be answered from the
# index. These are the same versions the crate already builds against, so no second copy
# of a grammar is compiled.
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
